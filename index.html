    <script>
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var patchDescriptor = function(target) {
            try {
              var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (desc && !desc.set && desc.configurable) {
                Object.defineProperty(target, 'fetch', {
                  get: function() { return originalFetch; },
                  set: function(fn) { originalFetch = typeof fn === 'function' ? fn.bind(window) : fn; },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e) {}
          };
          if (typeof Window !== 'undefined' && Window.prototype) {
            patchDescriptor(Window.prototype);
          }
          if (typeof window !== 'undefined') {
            patchDescriptor(window);
          }
        } catch (err) {}
      })();
    </script>
